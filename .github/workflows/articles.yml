name: Write articles

on:
  schedule:
    - cron: "11 3,15 * * *"   # about 8 AM and 8 PM Pakistan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python news.py headlines
      - run: python news.py articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save new stories
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout -- data/headlines.json data/status.json
          git add -A data/articles.json data/archive.json a *.html sitemap.xml news-sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Write articles"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
