name: Update headlines

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project files (first run only)
        run: |
          if [ -f news-site.zip ]; then
            unzip -o -q news-site.zip -d /tmp/unz
            rsync -a --exclude '.github' /tmp/unz/news-site/ ./
            rm -f news-site.zip
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python news.py headlines
      - name: Save new data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update headlines"
          git pull --rebase
          git push
