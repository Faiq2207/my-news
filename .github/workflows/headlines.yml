name: Update headlines

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (quieter than :00, so GitHub runs it on time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headlines        # separate from articles, so a long article run never blocks headlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python news.py headlines
      - name: Save new data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/headlines.json data/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Update headlines"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
